# train_phase1.yaml — Phase 1: Core Augmentation (H1 + H2)
# Run: python scripts/train.py --config configs/train_phase1.yaml
# Entry condition: Phase 0 OOF AUC measured.
# Exit criterion:  +0.03 macro AUC vs Phase 0; all taxon AUC > 0.60

experiment_name: phase1_bg_mixup

augmentation:
  background_noise:
    enabled: true
    snr_db_range: [-5.0, 10.0]   # H1: Pantanal soundscape overlay

  mixup:
    enabled: true
    alpha: 0.4                    # H2: waveform mixup lambda ~ Beta(0.4, 0.4)
    prob: 0.5                     # apply to 50% of training windows

# All other settings inherited from base.yaml + train.yaml
# See phase1_report.html for full experimental plan
